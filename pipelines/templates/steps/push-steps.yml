parameters:
- name: containerRegistry
  type: string

steps:
- checkout: self
  displayName: 'Checkout source code'

- task: Docker@2
  displayName: 'Login and Push to ACR'
  inputs:
    command: 'buildAndPush'
    containerRegistry: ${{ parameters.containerRegistry }}
    repository: '$(imageName)'
    dockerfile: '$(dockerfilePath)'
    tags: |
      $(Build.BuildId)
      latest

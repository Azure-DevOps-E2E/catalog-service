trigger:
- main

resources:
  repositories:
  - repository: configTemplates
    type: github
    endpoint: github.com_Azure-DevOps-E2E
    name: Azure-DevOps-E2E/config-management
    ref: refs/heads/main

pool:
  vmImage: ubuntu-latest

stages:
- template: pipelines/templates/service-stages.yml@configTemplates
  parameters:
    serviceName: catalog-service
    imageName: catalog-service
    dockerfilePath: Dockerfile
    containerRegistry: acrLoginServer
    qualitySteps:
    - template: pipelines/templates/steps/checkout.yml@configTemplates
    - template: pipelines/templates/steps/python/setup.yml@configTemplates
    - template: pipelines/templates/steps/python/install.yml@configTemplates
    - template: pipelines/templates/steps/python/pytest.yml@configTemplates
    - template: pipelines/templates/steps/python/verify.yml@configTemplates
    - template: pipelines/templates/steps/reports.yml@configTemplates
    - template: pipelines/templates/steps/qodana.yml@configTemplates
      parameters:
        linter: qodana-python-community

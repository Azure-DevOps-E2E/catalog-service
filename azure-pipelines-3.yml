trigger:
- main

resources:
  repositories:
  - repository: configTemplates
    type: github
    endpoint: github.com_Azure-DevOps-E2E
    name: Azure-DevOps-E2E/config-management
    ref: refs/heads/main

pool:
  vmImage: ubuntu-latest

stages:
- template: pipelines/templates/service-stages.yml@configTemplates
  parameters:
    serviceName: catalog-service
    imageName: catalog-service
    dockerfilePath: Dockerfile
    containerRegistry: acrLoginServer
    qualitySteps:
    - task: UsePythonVersion@0
      displayName: 'Use Python 3.13'
      inputs:
        versionSpec: '3.13'

    - bash: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install --requirement requirements-dev.txt
        python -m ruff check .
        python -m pytest
        python -m compileall -q app tests
      displayName: 'Lint, test, and build-check'

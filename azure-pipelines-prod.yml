trigger:
  batch: true
  branches:
    include:
    - main

pr: none

resources:
  repositories:
  - repository: templates
    type: github
    endpoint: github.com_Azure-DevOps-E2E
    name: Azure-DevOps-E2E/config-management
    ref: refs/heads/main

variables:
- name: serviceName
  value: 'catalog-service'
- name: imageRepository
  value: 'catalog-service'
- name: pythonVersion
  value: '3.13'
- name: requirementsFile
  value: requirements-dev.txt
- name: testResultsFile
  value: '$(System.DefaultWorkingDirectory)/reports/test-results.xml'
- name: coverageSummaryFile
  value: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'

pool:
  name: 'Azure Pipelines'

extends:
  template: pipelines/templates/pipeline-contract.yml@templates
  parameters:
    pipelineStages:
    - stage: CI
      displayName: 'CI - $(serviceName)'
      jobs:
      - job: Quality
        displayName: 'Test and build $(serviceName)'
        steps:
        - checkout: self
          clean: true
          fetchDepth: 1
          displayName: 'Checkout source code'

        # Host Python setup is kept commented for rollback. Quality now runs in Docker.
        # - task: UsePythonVersion@0
        #   displayName: 'Use Python $(pythonVersion)'
        #   inputs:
        #     versionSpec: '$(pythonVersion)'
        #
        # - template: steps/python/install.yml@templates
        #   parameters:
        #     requirementsFile: '$(requirementsFile)'
        #
        # - template: steps/python/pytest.yml@templates
        #   parameters:
        #     coverageSource: app
        #     testResultsFile: reports/test-results.xml
        #     coverageReportFile: coverage/cobertura-coverage.xml
        #
        # - template: steps/python/verify.yml@templates
        #   parameters:
        #     compileTargets: app tests

        - template: steps/container/prepare-build-image.yml@templates
          parameters:
            runtime: python
            version: '$(pythonVersion)'

        - template: steps/python/quality-container.yml@templates
          parameters:
            cacheKey: '$(serviceName)-python$(pythonVersion)'
            requirementsFile: '$(requirementsFile)'
            coverageSource: app
            testResultsFile: reports/test-results.xml
            coverageReportFile: coverage/cobertura-coverage.xml
            compileTargets: app tests

        - task: PublishTestResults@2
          displayName: 'Publish test report'
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: JUnit
            testResultsFiles: '$(testResultsFile)'
            searchFolder: '$(System.DefaultWorkingDirectory)'
            mergeTestResults: true
            failTaskOnFailedTests: true
            failTaskOnFailureToPublishResults: true
            failTaskOnMissingResultsFile: true
            testRunTitle: '$(serviceName) tests'

        - task: UseDotNet@2
          displayName: 'Use .NET SDK for coverage publisher'
          condition: succeededOrFailed()
          inputs:
            packageType: sdk
            version: '8.x'
        - bash: |
            set -euo pipefail
            if [ -f "$(coverageSummaryFile)" ]; then
              echo "##vso[task.setvariable variable=coverageSummaryFileExists]true"
            else
              echo "##vso[task.setvariable variable=coverageSummaryFileExists]false"
            fi
          displayName: 'Detect coverage report'
          condition: succeededOrFailed()

        - task: PublishCodeCoverageResults@2
          displayName: 'Publish coverage report'
          condition: and(succeededOrFailed(), eq(variables['coverageSummaryFileExists'], 'true'))
          inputs:
            summaryFileLocation: '$(coverageSummaryFile)'
            pathToSources: '$(Build.SourcesDirectory)'
            failIfCoverageEmpty: true

    - stage: ResolveCandidate
      displayName: 'Resolve DEV candidate - $(serviceName)'
      dependsOn: CI
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      jobs:
      - job: Resolve
        displayName: 'Validate dev-to-main promotion source'
        steps:
        - checkout: self
          clean: true
          fetchDepth: 0
          persistCredentials: true
          displayName: 'Checkout full Git history'

        - template: steps/container/resolve-candidate.yml@templates
